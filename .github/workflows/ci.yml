name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wellbe
          POSTGRES_PASSWORD: wellbe
          POSTGRES_DB: wellbe_landing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wellbe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Without TEST_DATABASE_URL the integration tests skip themselves, so
      # this step is what makes sure they actually ran.
      - name: Tests
        env:
          TEST_DATABASE_URL: postgres://wellbe:wellbe@localhost:5432/wellbe_landing_test
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release
