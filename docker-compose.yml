# Just the database. The app runs from `cargo run` while you are working on it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wellbe
      POSTGRES_PASSWORD: wellbe
      POSTGRES_DB: wellbe_landing
    ports:
      - "5432:5432"
    volumes:
      - wellbe-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellbe -d wellbe_landing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wellbe-db:
