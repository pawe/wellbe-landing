<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}wellbe.social{% endblock %}</title>
<meta name="description" content="wellbe.social will help you connect and share with the people in your life. In a healthy way. On your terms. A democratically organised non-profit, building for the long term.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="wellbe.social">
<meta property="og:description" content="We are going to build a place to connect and share with the people in your life. In a healthy way. On your terms.">
<meta property="og:type" content="website">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <a class="wordmark" href="/">
    <span class="wordmark-mark" aria-hidden="true"></span>
    <span>wellbe<span class="wordmark-dot">.social</span></span>
  </a>
  <p class="masthead-note">A non-profit, in the making.</p>
</header>

<main id="main">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <p class="footer-line">
    wellbe.social is being built by a democratically organised non-profit.
    Nothing on this page is tracked: no analytics, no third-party fonts, no cookies.
    <a href="/">Start again</a>
  </p>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
